name: Build model API

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton "Run workflow" pour reconstruire après un nouvel entraînement

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/digits-api:latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (fetches the latest model from DagsHub)
        uses: docker/build-push-action@v7
        with:
          context: ./api
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            MLFLOW_TRACKING_URI=https://dagshub.com/AlexM872/DVC_MLFLOW.mlflow
            MLFLOW_TRACKING_USERNAME=AlexM872
          secrets: |
            dagshub_token=${{ secrets.DAGSHUB_TOKEN }}

      - name: Test /predict
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE"
          for i in $(seq 1 30); do curl -sf localhost:8000/docs > /dev/null && break; sleep 2; done
          curl -sf -X POST localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d @api/sample.json || (docker logs api; exit 1)

      - name: Push to Docker Hub
        run: docker push "$IMAGE"